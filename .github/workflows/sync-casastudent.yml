name: Sync CasaStudent master
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/sync-casastudent.yml']
  schedule:
    - cron: '22 3 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 https://github.com/alessandroschiavon73-design/CasaStudentSpain.git /tmp/casastudent
      - run: rsync -a --delete --exclude '.git' --exclude '.github' --exclude 'CNAME' /tmp/casastudent/ ./
      - name: Apply StudentBnB identity and concept
        run: |
          mkdir -p assets/css assets/js
          cat > assets/css/studentbnb-brand.css <<'EOF'
          :root{--yellow:#0F766E;--yellow-dark:#115E59;--yellow-soft:#CCFBF1}.site-header{background:#0F766E;color:#fff}.site-header .brand,.site-header .main-nav a,.site-header .account-link{color:#fff}.site-header .brand strong{color:#99F6E4;text-shadow:none}.site-header .brand small{color:#D8F3EF}.site-header .brand>span::after{content:'a CasaStudent project';display:block;font-size:10px;font-weight:650;color:#CCFBF1}.breadcrumb{background:#0F766E;color:#fff}.btn-yellow{background:#0F766E;color:#fff}.hero-copy h1 span,.kicker{color:#0F766E}.studentbnb-tagline{display:inline-block;margin-bottom:12px;font-size:13px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#0F766E}.studentbnb-concept{max-width:520px}.casastudent-family{margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.16);font-size:13px}
          EOF
          cat > assets/js/studentbnb-brand.js <<'EOF'
          document.addEventListener('DOMContentLoaded',()=>{const hero=document.querySelector('.home-hero .hero-copy');if(hero){const h=hero.querySelector('h1'),p=hero.querySelector(':scope > p');if(h){const t=document.createElement('div');t.className='studentbnb-tagline';t.textContent='Base to belong';h.before(t);h.innerHTML='Prueba antes de <span>elegir.</span>';}if(p){p.classList.add('studentbnb-concept');p.textContent='Vive unos días en la que podría ser tu futura casa, conoce a tus posibles compañeros de piso y decide con más seguridad antes de mudarte definitivamente.';}const sh=hero.querySelector('.search-card h2');if(sh)sh.textContent='¿Dónde quieres probar?';}const f=document.querySelector('.site-footer .container')||document.querySelector('footer');if(f&&!f.querySelector('.casastudent-family')){const b=document.createElement('div');b.className='casastudent-family';b.innerHTML='StudentBnB forma parte de la familia <a href="https://casastudent.es/">CasaStudent ↗</a> · StudentBnB para probar, CasaStudent para quedarte.';f.appendChild(b)}});
          EOF
          find . -maxdepth 1 -name '*.html' -print0 | while IFS= read -r -d '' f; do sed -i 's#</head>#<link rel="stylesheet" href="assets/css/studentbnb-brand.css?v=2"></head>#' "$f"; sed -i 's#</body>#<script src="assets/js/studentbnb-brand.js?v=2"></script></body>#' "$f"; sed -i 's#<title>CasaStudent#<title>StudentBnB#g' "$f"; sed -i 's|content="#ffc400"|content="#0F766E"|g' "$f"; done
      - run: |
          git config user.name 'StudentBnB Sync'; git config user.email 'actions@github.com'; git add -A; if ! git diff --cached --quiet; then git commit -m 'Sync CasaStudent with StudentBnB try-before-you-move concept [skip ci]'; git push; fi
