name: Sync CasaStudent master
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/sync-casastudent.yml']
  schedule:
    - cron: '22 3 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 https://github.com/alessandroschiavon73-design/CasaStudentSpain.git /tmp/casastudent
      - run: rsync -a --delete --exclude '.git' --exclude '.github' --exclude 'CNAME' /tmp/casastudent/ ./
      - name: Apply StudentBnB identity
        run: |
          mkdir -p assets/css assets/js
          cat > assets/css/studentbnb-brand.css <<'EOF'
          :root{--yellow:#0F766E;--yellow-dark:#115E59;--yellow-soft:#CCFBF1}.site-header{background:#0F766E;color:#fff}.site-header .brand,.site-header .main-nav a,.site-header .account-link{color:#fff}.site-header .brand strong{color:#99F6E4;text-shadow:none}.site-header .brand small{color:#D8F3EF}.site-header .brand>span::after{content:'a CasaStudent project';display:block;font-size:10px;font-weight:650;letter-spacing:.035em;color:#CCFBF1;margin-top:1px}.breadcrumb{background:#0F766E;color:#fff}.btn-yellow{background:#0F766E;color:#fff}.hero-copy h1 span,.kicker{color:#0F766E}.notice{background:#E9FBF7;border-color:#A7E9DF}.icon-circle{background:#DDF8F3}.casastudent-family{margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.16);font-size:13px}.casastudent-family a{font-weight:800;text-decoration:underline;text-underline-offset:3px}
          EOF
          cat > assets/js/studentbnb-brand.js <<'EOF'
          document.addEventListener('DOMContentLoaded',()=>{const f=document.querySelector('.site-footer .container')||document.querySelector('footer');if(f&&!f.querySelector('.casastudent-family')){const b=document.createElement('div');b.className='casastudent-family';b.innerHTML='StudentBnB forma parte de la familia <a href="https://casastudent.es/">CasaStudent ↗</a>';f.appendChild(b)}});
          EOF
          find . -maxdepth 1 -name '*.html' -print0 | while IFS= read -r -d '' f; do sed -i 's#</head>#<link rel="stylesheet" href="assets/css/studentbnb-brand.css?v=1"></head>#' "$f"; sed -i 's#</body>#<script src="assets/js/studentbnb-brand.js?v=1"></script></body>#' "$f"; sed -i 's#<title>CasaStudent#<title>StudentBnB#g' "$f"; sed -i 's#content="#ffc400"#content="#0F766E"#g' "$f"; done
      - run: |
          git config user.name 'StudentBnB Sync'; git config user.email 'actions@github.com'; git add -A; if ! git diff --cached --quiet; then git commit -m 'Sync full CasaStudent structure with StudentBnB branding [skip ci]'; git push; fi
